# Single-package workspace. pnpm v11 reads project settings from this file
# (not package.json#pnpm / non-auth .npmrc keys).

strictPeerDependencies: false
autoInstallPeers: true

# Nested UI-kit deps (e.g. react-strict-dom) are resolved via require.resolve paths.
publicHoistPattern:
  - '*react-strict-dom*'
  - '*react-native*'

overrides:
  "lockwright-lib-ui-react-native-components": "git+https://github.com/Dexterity-Works/lockwright-lib-ui-react-native-components.git#5a4ed69feda9b76c0de6f40cb12df72569beb9b4"
  react-native: 0.79.5
  react-native>@types/react: 18.3.0
  react-native-windows>react: 19.1.0

# Lifecycle scripts denied by default. Git-hosted packages use name@tarball-url keys.
allowBuilds:
  "esbuild@0.21.5": true
  "esbuild@0.25.12": true

patchedDependencies:
  "lockwright-utils-validator@0.0.10": patches/pear-apps-utils-validator@0.0.10.patch
